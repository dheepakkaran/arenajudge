name: Update Kaggle leaderboard

on:
  schedule:
    - cron: "17 6 * * *"        # daily, 06:17 UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab

permissions:
  contents: write                # needed to commit data/leaderboard.json

concurrency:
  group: leaderboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install --quiet "kaggle==2.2.4"   # pinned: flags checked against this version

      # Auth: either a new-style API token (secret KAGGLE_API_TOKEN, from kaggle.com/settings/api)
      # or the legacy kaggle.json pair (secrets KAGGLE_USERNAME + KAGGLE_KEY). Unset secrets
      # arrive as empty strings, so drop them before the CLI reads its KAGGLE_* variables.
      - name: Fetch leaderboard
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          [ -n "$KAGGLE_USERNAME" ] && [ -n "$KAGGLE_KEY" ] || unset KAGGLE_USERNAME KAGGLE_KEY
          if [ -z "${KAGGLE_API_TOKEN:-}" ] && [ -z "${KAGGLE_USERNAME:-}" ]; then
            echo "::error::No Kaggle credentials. Add the KAGGLE_API_TOKEN secret (or KAGGLE_USERNAME + KAGGLE_KEY)."
            exit 1
          fi
          python scripts/update_leaderboard.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update leaderboard snapshot"
            git push
          fi
